[package]
name = "lingmo"
version = "1.0.0"
description = "A Tauri App"
authors = ["yeego"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 不启用 devtools feature：Tauri 的门控是 any(debug_assertions, feature = "devtools")，
# 因此 debug 构建仍自带检查器，而 release 包不再内置，避免把它发给最终用户。
tauri = { version = "2", features = [ "macos-private-api", "protocol-asset", "image-png", "tray-icon" ] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# unsafe-headers 为必需项，不可移除：S3 图床签名需要设置 Host（src/lib/imageHosting/s3.ts），
# 热点源需要 Origin/Referer 过反爬（src/lib/ai-hotspots/fetchers/），视频与小红书提取需要
# User-Agent 与 Sec-Fetch-*（src/lib/video-transcript.ts、src/lib/xhs-extractor.ts）。
# 该 feature 的风险边界取决于「谁能调到 plugin-http」，由 CSP 与 HTML 净化层共同约束。
tauri-plugin-http = { version = "=2.3.0", features = ["unsafe-headers"] }
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
urlencoding = "2.1.3"
percent-encoding = "2.3.0"
fuzzy-matcher = "0.3.7"
rayon = "1.8.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "blocking", "cookies"] }
futures-util = "0.3"
url = "2.5"
reqwest_dav = { version = "=0.2.1", default-features = false, features = ["rustls-tls"] }
tauri-plugin-opener = "2"
uuid = { version = "1.10", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.31", features = ["bundled-full"] }
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
serde_yaml = "0.9"
chrono = "0.4"
thiserror = "1"
tempfile = "3"
tauri-plugin-notification = "2"
regex = "1"
base64 = "0.22"

[dependencies.tauri-plugin-sql]
features = ["sqlite"]
version = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "=2.9.0"
tauri-plugin-window-state = "=2.3.0"
tauri-plugin-clipboard = "2"
xcap = "=0.6.0"
reqwest_dav = { version = "=0.2.1", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2"
jieba-rs = { version = "0.7", features = ["textrank"] }
machine-uid = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Threading"
] }
tauri-winrt-notification = "0.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.tauri]
version = "2"
features = []
