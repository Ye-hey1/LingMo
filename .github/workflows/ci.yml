name: CI

# PR 与主干推送的质量门禁。此前仓库只有 release.yml，构建前不做任何
# typecheck / lint / test，坏代码可以一路进到发布产物里。
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 聚合入口会自动发现 scripts/*-tests.mjs，新增测试脚本无需改 CI 配置
      - name: Test
        run: pnpm test

  rust:
    name: Cargo check / clippy / fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri 在 Linux 上的系统依赖
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # frontendDist 指向 ../out，cargo check 不跑前端构建，先造一个占位目录
      - name: Prepare frontend dist placeholder
        run: mkdir -p out && touch out/index.html

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # 暂不加 -D warnings：仓库现存 49 个 clippy warning（多为 collapsible_if、
      # needless_return、too_many_arguments），清理属独立任务。先让结果可见，
      # 待存量清零后再收紧为阻塞门禁。
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
        continue-on-error: true
